basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  database.Witness:
    properties:
      name:
        type: string
      position:
        type: string
    type: object
  incident.createBody:
    properties:
      areaId:
        type: string
      category:
        type: string
      description:
        type: string
      hasVictim:
        type: boolean
      incidentDatetime:
        type: string
      initialTreatment:
        type: string
      injuryDescription:
        type: string
      locationId:
        type: string
      severity:
        type: string
      title:
        type: string
      victimName:
        type: string
      victimPosition:
        type: string
      witnesses:
        items:
          $ref: '#/definitions/database.Witness'
        type: array
    type: object
  incident.patchBody:
    properties:
      areaId:
        type: string
      category:
        type: string
      description:
        type: string
      hasVictim:
        type: boolean
      incidentDatetime:
        type: string
      initialTreatment:
        type: string
      injuryDescription:
        type: string
      locationId:
        type: string
      reason:
        type: string
      severity:
        type: string
      status:
        type: string
      title:
        type: string
      victimName:
        type: string
      victimPosition:
        type: string
      witnesses:
        items:
          $ref: '#/definitions/database.Witness'
        type: array
    type: object
  location.areaBody:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  location.locationBody:
    properties:
      code:
        type: string
      hseOfficerId:
        type: string
      name:
        type: string
      regionId:
        type: string
      supervisorId:
        type: string
      type:
        type: string
    type: object
  location.regionBody:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  user.createBody:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  user.patchBody:
    properties:
      name:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  workflow.commentBody:
    properties:
      comment:
        type: string
    type: object
info:
  contact: {}
  description: 'K3 incident reporting backend (Phase 2: incidents, workflow, files).'
  title: Aegis API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Logout
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Refresh access token
      tags:
      - auth
  /incidents:
    get:
      parameters:
      - description: status
        in: query
        name: status
        type: string
      - description: category
        in: query
        name: category
        type: string
      - description: location id
        in: query
        name: locationId
        type: string
      - description: from RFC3339
        in: query
        name: from
        type: string
      - description: to RFC3339
        in: query
        name: to
        type: string
      - description: page
        in: query
        name: page
        type: integer
      - description: page size
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List incidents
      tags:
      - incidents
    post:
      consumes:
      - application/json
      parameters:
      - description: incident
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/incident.createBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create incident draft
      tags:
      - incidents
  /incidents/{id}:
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get incident
      tags:
      - incidents
    patch:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/incident.patchBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update incident
      tags:
      - incidents
  /incidents/{id}/close:
    post:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Close incident
      tags:
      - workflow
  /incidents/{id}/files:
    get:
      parameters:
      - description: incident id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List incident files
      tags:
      - files
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: incident id
        in: path
        name: id
        required: true
        type: string
      - description: files
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Upload incident evidence
      tags:
      - files
  /incidents/{id}/files/{fileId}:
    delete:
      parameters:
      - description: incident id
        in: path
        name: id
        required: true
        type: string
      - description: file id
        in: path
        name: fileId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete draft incident file
      tags:
      - files
  /incidents/{id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: comment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/workflow.commentBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Reject incident
      tags:
      - workflow
  /incidents/{id}/start-corrective-action:
    post:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Move incident to corrective action (P2 stub)
      tags:
      - workflow
  /incidents/{id}/submit:
    post:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Submit incident draft
      tags:
      - incidents
  /incidents/{id}/timeline:
    get:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Incident workflow timeline
      tags:
      - workflow
  /incidents/{id}/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: comment
        in: body
        name: request
        schema:
          $ref: '#/definitions/workflow.commentBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Verify incident (supervisor)
      tags:
      - workflow
  /locations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List locations
      tags:
      - locations
    post:
      consumes:
      - application/json
      parameters:
      - description: location
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/location.locationBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create location
      tags:
      - locations
  /locations/{id}:
    delete:
      parameters:
      - description: location id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Deactivate location
      tags:
      - locations
    patch:
      consumes:
      - application/json
      parameters:
      - description: location id
        in: path
        name: id
        required: true
        type: string
      - description: fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/location.locationBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update location
      tags:
      - locations
  /locations/{id}/areas:
    get:
      parameters:
      - description: location id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List areas
      tags:
      - locations
    post:
      consumes:
      - application/json
      parameters:
      - description: location id
        in: path
        name: id
        required: true
        type: string
      - description: area
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/location.areaBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create area
      tags:
      - locations
  /regions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
